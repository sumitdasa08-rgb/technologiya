<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Preconnect to critical domains for faster loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Load fonts with display=swap for instant text rendering -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
    <title>LogicLabs</title>
    <meta name="description" content="LogicLabs - Professional Tech Support" />
    <meta name="author" content="LogicLabs" />
    <meta property="og:title" content="LogicLabs - Tech Repair" />
    <meta property="og:description" content="Professional tech repair services" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@LogicLabs" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
    <!-- Inline critical CSS for instant loader -->
    <style>
      body{margin:0;background:#0a0a0a}
      #initial-loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0a0a0a;z-index:9999;opacity:1;transition:opacity .3s ease-out}
      #initial-loader.fade-out{opacity:0;pointer-events:none}
      .loader-content{text-align:center;animation:fadeInUp .4s ease-out}
      .loader-logo{width:64px;height:64px;margin:0 auto 16px;border-radius:16px;background:#fafafa;display:flex;align-items:center;justify-content:center;animation:pulse 1.2s ease-in-out infinite}
      .loader-logo span{font-size:24px;font-weight:bold;color:#0a0a0a;font-family:system-ui,-apple-system,sans-serif}
      .loader-text{font-size:14px;color:#71717a;font-family:system-ui,-apple-system,sans-serif;animation:fadeIn .5s ease-out .15s forwards;opacity:0}
      @keyframes fadeInUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
      @keyframes fadeIn{from{opacity:0}to{opacity:1}}
      @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Ultra-light initial loader - renders instantly -->
      <div id="initial-loader">
        <div class="loader-content">
          <div class="loader-logo"><span>L</span></div>
          <p class="loader-text">Loading...</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
