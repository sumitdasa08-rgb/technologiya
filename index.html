    <!-- Inline critical CSS for Gen Z style loader -->
    <style>
      *{margin:0;padding:0;box-sizing:border-box}
       body{background:#080808;overflow:hidden}
      
      #initial-loader{
        position:fixed;inset:0;z-index:9999;
        display:flex;align-items:center;justify-content:center;
         background:#080808;
        opacity:1;transition:opacity .4s ease-out
      }
      #initial-loader.fade-out{opacity:0;pointer-events:none}
      
       /* Silver glass background */
       .glass-bg{
        position:absolute;inset:0;
         background:linear-gradient(135deg,#080808 0%,#121212 50%,#080808 100%);
        overflow:hidden
      }
      
       /* Silver glow orbs */
       .silver-orb{
        position:absolute;border-radius:50%;filter:blur(60px);
        animation:orbFloat 4s ease-in-out infinite
      }
       .silver-orb-1{width:200px;height:200px;background:rgba(200,200,200,0.15);top:20%;left:10%;animation-delay:0s}
       .silver-orb-2{width:150px;height:150px;background:rgba(180,180,180,0.12);bottom:30%;right:15%;animation-delay:1s}
       .silver-orb-3{width:100px;height:100px;background:rgba(220,220,220,0.1);top:60%;left:60%;animation-delay:2s}
      @keyframes orbFloat{
         0%,100%{transform:translateY(0) scale(1);opacity:0.4}
         50%{transform:translateY(-20px) scale(1.1);opacity:0.6}
      }
      
      /* Loader content */
      .loader-content{
        position:relative;z-index:10;
        text-align:center;
        animation:fadeSlideUp .6s ease-out
      }
      @keyframes fadeSlideUp{
        from{opacity:0;transform:translateY(20px)}
        to{opacity:1;transform:translateY(0)}
      }
      
      /* Logo with glow */
       .logo-3d-wrapper{
         position:relative;width:96px;height:96px;margin:0 auto 32px;
         perspective:1000px
       }
       .logo-silver-glow{
         position:absolute;inset:-20px;
         background:radial-gradient(circle,rgba(200,200,200,0.3) 0%,transparent 70%);
         filter:blur(30px);
         animation:glowPulse 3s ease-in-out infinite
      }
      @keyframes glowPulse{
         0%,100%{opacity:0.3;transform:scale(1)}
         50%{opacity:0.5;transform:scale(1.05)}
       }
       .logo-3d{
         position:relative;width:96px;height:96px;
         transform:rotateY(-5deg) rotateX(5deg);
         transform-style:preserve-3d;
         animation:logoFloat 4s ease-in-out infinite
       }
       @keyframes logoFloat{
         0%,100%{transform:rotateY(-5deg) rotateX(5deg) translateY(0)}
         50%{transform:rotateY(-5deg) rotateX(5deg) translateY(-8px)}
       }
       .logo-3d img{
         width:100%;height:100%;object-fit:contain;
         filter:drop-shadow(0 10px 30px rgba(200,200,200,0.2)) invert(1)
       }
       
       /* Bouncing dots loader */
       .dots-loader{
         display:flex;align-items:center;justify-content:center;gap:6px
       }
       .dot{
         width:8px;height:8px;
         background:rgba(200,200,200,0.8);
         border-radius:50%;
         animation:dotBounce 0.6s ease-in-out infinite
       }
       .dot:nth-child(1){animation-delay:0s}
       .dot:nth-child(2){animation-delay:0.1s}
       .dot:nth-child(3){animation-delay:0.2s}
       @keyframes dotBounce{
         0%,100%{transform:translateY(0)}
         50%{transform:translateY(-8px)}
      }
    </style>
