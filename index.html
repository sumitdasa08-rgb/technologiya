<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google Fonts - Poppins for headings, Space Grotesk for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"></noscript>
    <title>LogicLabs</title>
    <meta name="description" content="LogicLabs - Professional Tech Support" />
    <meta name="author" content="LogicLabs" />

    <!-- TODO: Update og:title to match your application name -->
    <meta property="og:title" content="Lovable App" />
    <meta property="og:description" content="Lovable Generated Project" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Lovable" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
  </head>

  <body>
    <div id="root">
      <!-- Initial loading state before React hydrates - with smooth fade -->
      <div id="initial-loader" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0a0a0a;opacity:1;transition:opacity 0.4s ease-out;z-index:9999;">
        <div style="text-align:center;animation:fadeInUp 0.5s ease-out forwards;">
          <div style="width:64px;height:64px;margin:0 auto 16px;border-radius:16px;background:#fafafa;display:flex;align-items:center;justify-content:center;animation:pulse 1.5s ease-in-out infinite;">
            <span style="font-size:24px;font-weight:bold;color:#0a0a0a;">L</span>
          </div>
          <p style="font-size:14px;color:#a1a1aa;animation:fadeIn 0.6s ease-out 0.2s forwards;opacity:0;">Loading...</p>
        </div>
      </div>
      <style>
        @keyframes fadeInUp {
          from { opacity: 0; transform: translateY(10px); }
          to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
          from { opacity: 0; }
          to { opacity: 1; }
        }
        @keyframes pulse {
          0%, 100% { transform: scale(1); }
          50% { transform: scale(1.05); }
        }
        #initial-loader.fade-out {
          opacity: 0;
          pointer-events: none;
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
